<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin | Approvals</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body { background:#0b0f19; color:white; font-family:'Tajawal'; padding:30px; }
.card {
    background:#131b2e;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
    border:1px solid rgba(255,255,255,0.1);
}
button {
    padding:8px 12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
.approve { background:#10b981; }
.reject { background:#ef4444; }
</style>
</head>
<body>

<h1>Pending Approvals</h1>
<div id="users"></div>

<script>
async function loadUsers() {
    const res = await fetch('/api/users');
    const users = await res.json();

    const container = document.getElementById('users');
    container.innerHTML = '';

    users.filter(u => !u.approved).forEach(u => {
        container.innerHTML += `
            <div class="card">
                <h3>${u.username}</h3>
                <p>ID: ${u.discordId}</p>
                <button class="approve" onclick="approve('${u.discordId}')">Approve</button>
            </div>
        `;
    });
}

async function approve(id) {
    await fetch('/api/approve-user', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ discordId:id })
    });
    loadUsers();
}

loadUsers();
</script>

</body>
</html>
