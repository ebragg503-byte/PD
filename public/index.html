<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم LSPD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid #334155; margin-bottom: 20px; }
        h1 { color: #38bdf8; font-size: 1.8rem; }
        table { width: 100%; border-collapse: collapse; background-color: #1e293b; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: right; border-bottom: 1px solid #334155; }
        th { background-color: #0284c7; color: #fff; }
        tr:hover { background-color: #334155; }
        .badge { background-color: #0369a1; padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; margin-left: 4px; display: inline-block; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fa-solid fa-shield-halved"></i> لوحة تحكم LSPD</h1>
            <a href="/login.html" style="color: #38bdf8; text-decoration: none;"><i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول</a>
        </header>

        <h2>قائمة العسكريين</h2>
        <br>
        <table>
            <thead>
                <tr>
                    <th>الاسم</th>
                    <th>الرتبة</th>
                    <th>الساعات</th>
                    <th>النقاط</th>
                    <th>الوينقات</th>
                </tr>
            </thead>
            <tbody id="cadetsTable">
                <tr><td colspan="5" style="text-align: center;">جاري تحميل البيانات...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const socket = io();

        socket.on('cadetsUpdate', (cadets) => {
            const tbody = document.getElementById('cadetsTable');
            tbody.innerHTML = '';

            cadets.forEach(c => {
                const wingsHtml = (c.wings || []).map(w => `<span class="badge">${w}</span>`).join(' ');
                const row = `
                    <tr>
                        <td><b>${c.name}</b></td>
                        <td>${c.rank}</td>
                        <td>${c.hours} ساعة</td>
                        <td>${c.points} نقطة</td>
                        <td>${wingsHtml || '-'}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        });
    </script>
</body>
</html>
