<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام متابعة الأكاديمية | Cadet Tracker</title>
    <!-- خط Tajawal لتنسيق عربي احترافي -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- مكتبة أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: rgba(22, 30, 49, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-blue: #38bdf8;
            --accent-indigo: #6366f1;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
        }

        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.12) 0px, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* الهيدر العلوي */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 18px 25px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand i {
            font-size: 28px;
            color: var(--accent-blue);
            background: rgba(56, 189, 248, 0.1);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .brand h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* الإحصائيات السريعة */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .stat-info h3 { font-size: 22px; font-weight: 700; }
        .stat-info p { font-size: 13px; color: var(--text-secondary); }

        /* الأزرار والتنقّل */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            background: rgba(15, 23, 42, 0.6);
            padding: 6px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .tab-btn {
            background: transparent;
            color: var(--text-secondary);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn.active {
            background: var(--accent-blue);
            color: #0b0f19;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }

        /* الجدول الرئيسي */
        .table-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        th {
            background: rgba(15, 23, 42, 0.8);
            padding: 18px 24px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 700;
            border-bottom: 1px solid var(--card-border);
        }

        td {
            padding: 18px 24px;
            border-bottom: 1px solid var(--card-border);
            font-size: 14px;
        }

        tr:last-child td { border-bottom: none; }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .officer-name {
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge-rank {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .cadet { background: rgba(56, 189, 248, 0.15); color: var(--accent-blue); border: 1px solid rgba(56, 189, 248, 0.3); }
        .solo-cadet { background: rgba(99, 102, 241, 0.15); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3); }

        .hours-tag {
            color: var(--accent-green);
            font-weight: 800;
            background: rgba(16, 185, 129, 0.1);
            padding: 6px 12px;
            border-radius: 8px;
            display: inline-block;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-view { background: rgba(255, 255, 255, 0.08); color: var(--text-primary); }
        .btn-view:hover { background: rgba(255, 255, 255, 0.15); }

        .btn-edit { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); border: 1px solid rgba(245, 158, 11, 0.3); }
        .btn-edit:hover { background: var(--accent-amber); color: #000; }

        /* النوافذ المنبثقة Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: #131b2e;
            border: 1px solid var(--card-border);
            border-radius: 20px;
            width: 520px;
            max-width: 90%;
            padding: 28px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: modalFade 0.25s ease-out;
        }

        @keyframes modalFade {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--card-border);
        }

        .modal-header h3 { font-size: 18px; font-weight: 700; }
        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-secondary);
            width: 32px; height: 32px;
            border-radius: 8px;
            cursor: pointer;
        }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--accent-blue);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--accent-blue);
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-submit:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- الهيدر -->
        <div class="navbar">
            <div class="brand">
                <i class="fa-solid fa-shield-halved"></i>
                <div>
                    <h1>لوحة متابعة الأكاديمية</h1>
                    <p>نظام التتبع المباشر لضباط Cadet و Solo Cadet</p>
                </div>
            </div>
        </div>

        <!-- الإحصائيات -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(56, 189, 248, 0.15); color: var(--accent-blue);">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <div class="stat-info">
                    <h3 id="statTotal">0</h3>
                    <p>إجمالي العسكريين الحاليين</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(16, 185, 129, 0.15); color: var(--accent-green);">
                    <i class="fa-solid fa-clock"></i>
                </div>
                <div class="stat-info">
                    <h3 id="statHours">0</h3>
                    <p>مجموع الساعات المسجلة</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(245, 158, 11, 0.15); color: var(--accent-amber);">
                    <i class="fa-solid fa-file-contract"></i>
                </div>
                <div class="stat-info">
                    <h3 id="statReports">0</h3>
                    <p>إجمالي التقارير</p>
                </div>
            </div>
        </div>

        <!-- أزرار التنقل -->
        <div class="controls">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('active', this)">
                    <i class="fa-solid fa-users"></i> العسكريين الحاليين
                </button>
                <button class="tab-btn" onclick="switchTab('archived', this)">
                    <i class="fa-solid fa-box-archive"></i> الأرشيف (منزوعين الرتبة)
                </button>
            </div>
        </div>

        <!-- الجدول -->
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>اسم العسكري</th>
                        <th>الرتبة الحالية</th>
                        <th>إجمالي الساعات</th>
                        <th>تقارير الـ MDT</th>
                        <th style="text-align: center;">الإجراءات والعمليات</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

    </div>

    <!-- نافذة عرض التقارير -->
    <div class="modal-overlay" id="reportsModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalOfficerName"><i class="fa-solid fa-folder-open"></i> تقارير العسكري</h3>
                <button class="close-btn" onclick="closeModal('reportsModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="modalReportsList" style="max-height: 350px; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- نافذة التعديل اليدوي والتحديث -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="editOfficerName"><i class="fa-solid fa-pen-to-square"></i> تعديل البيانات وإضافة تقرير</h3>
                <button class="close-btn" onclick="closeModal('editModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="manualEditForm">
                <input type="hidden" id="editDiscordId">
                <div class="form-group">
                    <label><i class="fa-solid fa-stopwatch"></i> تعديل إجمالي الساعات:</label>
                    <input type="number" step="0.5" id="manualHours" placeholder="مثال: 15.5">
                </div>
                
                <div style="margin: 20px 0 10px 0; border-top: 1px solid var(--card-border); padding-top: 15px;">
                    <h4 style="font-size: 14px; color: var(--accent-amber);"><i class="fa-solid fa-plus-circle"></i> إضافة تقرير MDT سابق:</h4>
                </div>

                <div class="form-group">
                    <label>عنوان التقرير:</label>
                    <input type="text" id="manualReportTitle" placeholder="مثال: تقرير قضية سرقة أو دورية">
                </div>
                <div class="form-group">
                    <label>تفاصيل التقرير:</label>
                    <textarea id="manualReportContent" rows="3" placeholder="أدخل تفاصيل التقرير أو الرابط..."></textarea>
                </div>
                <button type="submit" class="btn-submit"><i class="fa-solid fa-floppy-disk"></i> حفظ البيانات المحدثة</button>
            </form>
        </div>
    </div>

    <script>
        let allData = [];
        let currentTab = 'active';

        async function fetchCadets() {
            try {
                const res = await fetch('/api/cadets');
                allData = await res.json();
                updateStats();
                renderTable();
            } catch(e) { console.error(e); }
        }

        function updateStats() {
            const activeOnly = allData.filter(i => i.status === 'active');
            document.getElementById('statTotal').innerText = activeOnly.length;
            
            const totalH = activeOnly.reduce((acc, curr) => acc + (curr.hours || 0), 0);
            document.getElementById('statHours').innerText = totalH + ' hrs';

            const totalR = activeOnly.reduce((acc, curr) => acc + (curr.reports ? curr.reports.length : 0), 0);
            document.getElementById('statReports').innerText = totalR;
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            const filtered = allData.filter(item => item.status === currentTab);

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--text-secondary); padding: 40px;">لا توجد بيانات مسجلة في هذا القسم حالياً</td></tr>`;
                return;
            }

            filtered.forEach(item => {
                const rankClass = item.rank === 'Solo Cadet' ? 'solo-cadet' : 'cadet';
                const rankIcon = item.rank === 'Solo Cadet' ? 'fa-star' : 'fa-graduation-cap';
                
                tbody.innerHTML += `
                    <tr>
                        <td>
                            <div class="officer-name">
                                <i class="fa-solid fa-user-circle" style="font-size: 20px; color: var(--text-secondary);"></i>
                                ${item.name}
                            </div>
                        </td>
                        <td><span class="badge-rank ${rankClass}"><i class="fa-solid ${rankIcon}"></i> ${item.rank}</span></td>
                        <td><span class="hours-tag">${item.hours || 0} ساعة</span></td>
                        <td><i class="fa-solid fa-file-alt" style="color:var(--text-secondary); margin-left: 5px;"></i> ${item.reports ? item.reports.length : 0} تقارير</td>
                        <td>
                            <div class="actions" style="justify-content: center;">
                                <button class="btn-action btn-view" onclick="showReports('${item.discordId}')">
                                    <i class="fa-solid fa-eye"></i> التقارير
                                </button>
                                <button class="btn-action btn-edit" onclick="openEditModal('${item.discordId}')">
                                    <i class="fa-solid fa-pen"></i> تعديل / إضافة
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        function switchTab(tab, btn) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTable();
        }

        function showReports(discordId) {
            const officer = allData.find(c => c.discordId === discordId);
            if (!officer) return;

            document.getElementById('modalOfficerName').innerText = `تقارير العسكري: ${officer.name}`;
            const reportsList = document.getElementById('modalReportsList');
            reportsList.innerHTML = '';

            if (!officer.reports || officer.reports.length === 0) {
                reportsList.innerHTML = '<p style="color:var(--text-secondary); text-align:center; padding: 20px;">لا توجد تقارير مسجلة لهذا العسكري.</p>';
            } else {
                officer.reports.forEach(rep => {
                    reportsList.innerHTML += `
                        <div style="background:rgba(15, 23, 42, 0.8); padding:12px 15px; border-radius:10px; margin-bottom:10px; border:1px solid var(--card-border);">
                            <div style="font-size:11px; color:var(--accent-blue); font-weight:700;">${rep.date}</div>
                            <div style="font-weight:700; margin-top:4px; font-size:14px;">${rep.title}</div>
                            <div style="font-size:12px; color:var(--text-secondary); margin-top:4px;">${rep.content}</div>
                        </div>
                    `;
                });
            }

            document.getElementById('reportsModal').style.display = 'flex';
        }

        function openEditModal(discordId) {
            const officer = allData.find(c => c.discordId === discordId);
            if (!officer) return;

            document.getElementById('editDiscordId').value = officer.discordId;
            document.getElementById('editOfficerName').innerText = `تعديل بيانات: ${officer.name}`;
            document.getElementById('manualHours').value = officer.hours || 0;
            document.getElementById('manualReportTitle').value = '';
            document.getElementById('manualReportContent').value = '';

            document.getElementById('editModal').style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        document.getElementById('manualEditForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const discordId = document.getElementById('editDiscordId').value;
            const hours = document.getElementById('manualHours').value;
            const reportTitle = document.getElementById('manualReportTitle').value;
            const reportContent = document.getElementById('manualReportContent').value;

            try {
                const res = await fetch('/api/update-cadet-manual', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ discordId, hours, reportTitle, reportContent })
                });
                const data = await res.json();
                if (data.success) {
                    closeModal('editModal');
                    fetchCadets();
                }
            } catch (err) {
                console.error(err);
            }
        });

        fetchCadets();
    </script>
</body>
</html>
