<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Academy Dashboard</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div id="app">

        <!-- ========================= -->
        <!-- الإحصائيات -->
        <!-- ========================= -->
        <div class="stats-container">

            <div class="stat-box">
                <div class="stat-title">Total Active Cadets</div>
                <div class="stat-value" id="statTotal">0</div>
            </div>

            <div class="stat-box">
                <div class="stat-title">Total Logged Hours</div>
                <div class="stat-value" id="statHours">0,00</div>
            </div>

            <div class="stat-box">
                <div class="stat-title">Total MDT Reports</div>
                <div class="stat-value" id="statReports">0</div>
            </div>

        </div>

        <!-- ========================= -->
        <!-- التابات -->
        <!-- ========================= -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('active', this)">Active Cadets</button>
            <button class="tab-btn" onclick="switchTab('archived', this)">Archived (Rank Removed)</button>
        </div>

        <!-- ========================= -->
        <!-- الجدول -->
        <!-- ========================= -->
        <table class="cadets-table">
            <thead>
                <tr>
                    <th>Officer Name</th>
                    <th>Current Rank</th>
                    <th>Total Hours</th>
                    <th>MDT Reports</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>

        <!-- ========================= -->
        <!-- مودال التقارير -->
        <!-- ========================= -->
        <div id="reportsModal" class="modal">
            <div class="modal-content">
                <h2 id="modalOfficerName"></h2>
                <div id="modalReportsList"></div>
                <button onclick="closeModal('reportsModal')" class="close-btn">Close</button>
            </div>
        </div>

        <!-- ========================= -->
        <!-- مودال التعديل -->
        <!-- ========================= -->
        <div id="editModal" class="modal">
            <div class="modal-content">
                <h2 id="editOfficerName"></h2>

                <form id="manualEditForm">
                    <input type="hidden" id="editDiscordId">

                    <label>Hours:</label>
                    <input type="number" id="manualHours">

                    <label>Report Title:</label>
                    <input type="text" id="manualReportTitle">

                    <label>Report Content:</label>
                    <textarea id="manualReportContent"></textarea>

                    <button type="submit" class="save-btn">Save</button>
                </form>

                <button onclick="closeModal('editModal')" class="close-btn">Close</button>
            </div>
        </div>

    </div>

    <!-- ========================= -->
    <!-- Socket.io (مهم جدًا) -->
    <!-- ========================= -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- ========================= -->
    <!-- سكربت الموقع -->
    <!-- ========================= -->
    <script src="script.js"></script>

</body>
</html>
